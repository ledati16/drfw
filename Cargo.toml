[package]
name = "drfw"
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
description = "A safe, transparent nftables firewall for Linux, with a GUI and CLI"
authors = ["ledati16"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ledati16/drfw"
keywords = ["firewall", "nftables", "linux", "gui", "security"]
categories = ["command-line-utilities", "gui", "network-programming"]
# An application, not a library for crates.io
publish = false
default-run = "drfw"

[lints.clippy]
# Enable pedantic lints for thorough code quality checks
pedantic = { level = "warn", priority = -1 }

# UI view functions and parsers are naturally large - breaking them up reduces readability
too_many_lines = "allow"

# State management structs with many boolean flags are idiomatic for GUI applications
struct_excessive_bools = "allow"

# Linux filesystems are case-sensitive, we intentionally check lowercase .json
case_sensitive_file_extension_comparisons = "allow"

# Theme matching: same arms are intentional for clarity
match_same_arms = "allow"

# Theme creation requires many color parameters - this is unavoidable
too_many_arguments = "allow"

# Float comparisons: used for exact constant comparisons (brightness factors, test assertions)
float_cmp = "allow"

# Small types (4-6 bytes) passed by reference for API consistency
trivially_copy_pass_by_ref = "allow"

# ~100 public getters/constructors/predicates; `#[must_use]` on each is noise.
# Discarding a `Result` is still caught by rustc's `unused_must_use`.
must_use_candidate = "allow"

[dependencies]
# ═══════════════════════════════════════════════════════════════════════════
# GUI Framework
# ═══════════════════════════════════════════════════════════════════════════
# `advanced`: widget operations as tasks (focus queries and the scoped Tab
# cycle in `app::focus`); it adds no dependencies
iced = { version = "0.14", features = ["tokio", "advanced"] }  # Core GUI framework with async support

# ═══════════════════════════════════════════════════════════════════════════
# Async Runtime
# ═══════════════════════════════════════════════════════════════════════════
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "process"] }
# Required by iced, used for:
# - Async file I/O (atomic config writes)
# - Process spawning (nft/pkexec elevation)
# - Task execution in GUI context

# ═══════════════════════════════════════════════════════════════════════════
# Core Firewall Logic
# ═══════════════════════════════════════════════════════════════════════════
ipnetwork = { version = "0.21", features = ["serde"] }  # IP/CIDR parsing and validation for rules
uuid = { version = "1", features = ["v4", "serde"] }  # Unique rule IDs for command tracking
serde = { version = "1", features = ["derive"] }  # Serialization framework
serde_json = "1"  # Config files, profiles, nftables JSON generation
tempfile = "3"  # Atomic write pattern for security (temp → rename)
directories = "6"  # XDG Base Directory spec compliance
jiff = { version = "1.0.1", features = ["serde"] }  # Rule creation and audit timestamps (RFC 3339)

# ═══════════════════════════════════════════════════════════════════════════
# UI Helpers
# ═══════════════════════════════════════════════════════════════════════════
similar = "3"  # Diff algorithm for ruleset comparison (show changes)
rfd = "0.18"  # Native OS file dialogs (save/export)
network-interface = "2.0"  # Cross-platform network interface discovery
logos = "0.16"  # Declarative lexer generator (compile-time DFA)
strum = { version = "0.28", features = ["derive"] }  # Enum boilerplate elimination (Display, iter, etc.)
nucleo-matcher = "0.3"  # Fuzzy search for font and theme pickers

# ═══════════════════════════════════════════════════════════════════════════
# Error Handling & Logging
# ═══════════════════════════════════════════════════════════════════════════
thiserror = "2"  # Structured error types with user-friendly messages
tracing = "0.1"  # Structured logging framework
tracing-subscriber = "0.3"  # Logging configuration and output formatting

# ═══════════════════════════════════════════════════════════════════════════
# Security & System Integration
# ═══════════════════════════════════════════════════════════════════════════
fontdb = "0.24"  # System font enumeration for font picker
clap = { version = "4", features = ["derive"] }  # CLI argument parsing
nix = { version = "0.32", features = ["fs", "term", "user"] }  # Safe Unix syscalls (getuid, isatty, memfd_create)
crossterm = "0.29"  # Terminal control for CLI countdown timers

# ═══════════════════════════════════════════════════════════════════════════
# Build Information
# ═══════════════════════════════════════════════════════════════════════════
# No default features: the runtime side only needs the generated constants.
shadow-rs = { version = "2.0", default-features = false }  # Embed git commit, build time, dirty status at compile time

[build-dependencies]
# "build" without the default "git2" feature: shadow-rs falls back to the `git`
# CLI, keeping git2/libgit2-sys/libz-sys (C build + advisories) out of the tree.
shadow-rs = { version = "2.0", default-features = false, features = ["build"] }

[dev-dependencies]
proptest = "1"
rand = "0.10"

# ═══════════════════════════════════════════════════════════════════════════
# Development Tools
# ═══════════════════════════════════════════════════════════════════════════

# The root helper (src/helper.rs): the only program DRFW elevates when it is
# installed at DRFW_HELPER_PATH (default /usr/lib/drfw/drfw-helper)
[[bin]]
name = "drfw-helper"
path = "src/helper_main.rs"

[[bin]]
name = "stress_gen"
path = "tools/stress_gen.rs"
required-features = ["stress_gen"]

[dependencies.rand]
version = "0.10"
optional = true

[features]
stress_gen = ["rand"]
