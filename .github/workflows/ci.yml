name: CI

on:
  push:
    branches: [main, dev]
    # Release tags: the tagged commit is checked as it is
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly (Monday 06:00 UTC): surface new RustSec advisories and toolchain
    # lints even when nothing in the repo changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must match rust-toolchain.toml (and rust-version in Cargo.toml)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      # rustfmt.toml uses nightly-only options; keep this date in sync with
      # the `cargo +nightly-…` command in CLAUDE.md
      - name: Setup nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-11-14
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo +nightly-2026-11-14 fmt --check

      # Pedantic lints are configured in Cargo.toml [lints.clippy]
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (stress_gen feature)
        run: cargo clippy --all-targets --locked --features stress_gen -- -D warnings

      # Broken intra-doc links and malformed docs fail the build
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      # Real-nft integration tests run `nft` inside an unprivileged user+net
      # namespace, so they need the nft binary and user namespaces enabled.
      # The mock nft (tests/mock_nft.sh) needs jq.
      - name: Install nftables and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables jq

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build
        run: cargo build --all-targets --locked

      - name: Build stress_gen
        run: cargo build --locked --features stress_gen --bin stress_gen

      - name: Run tests
        env:
          # Fail (instead of skip) if real-nft tests cannot run here
          DRFW_REQUIRE_REAL_NFT: "1"
        run: cargo test --locked

      # The compile-time paths a distribution package sets (src/distro.rs):
      # tests must not assume the defaults. /usr/local/sbin is not in the
      # library's own nft search list, so DRFW_NFT_PATH really decides.
      - name: Run tests (packager config)
        env:
          DRFW_SYSTEM_NFT_PATH: /etc/sysconfig/nftables.conf
          DRFW_SYSTEM_NFT_SERVICE: drfw-test.service
          DRFW_NFT_PATH: /usr/local/sbin/nft
          DRFW_REQUIRE_REAL_NFT: "1"
        run: |
          sudo ln -sf /usr/sbin/nft /usr/local/sbin/nft
          cargo test --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Advisories, licenses, bans and sources; config in deny.toml (its
      # [graph] section selects all features and the target platforms)
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  latest-stable:
    name: Latest stable (early warning)
    runs-on: ubuntu-latest
    # Non-blocking: flags new lints/breakage before the pinned toolchain is bumped
    continue-on-error: true
    env:
      # Override rust-toolchain.toml so this job really uses latest stable
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # No nftables install and no DRFW_REQUIRE_REAL_NFT here: the real-nft
      # tests skip (with a notice); the test job runs them
      - name: Run tests
        run: cargo test --locked
