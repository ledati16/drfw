# Formatting uses nightly rustfmt for the options below (unstable in stable
# rustfmt): run `cargo +nightly-2026-11-14 fmt`. Builds use the pinned stable
# toolchain from rust-toolchain.toml.
edition = "2024"
style_edition = "2024"
unstable_features = true

# Imports: one `use` per module (flat, diff-friendly), grouped std / external / crate
imports_granularity = "Module"
group_imports = "StdExternalCrate"

# Comments and docs
normalize_comments = true
normalize_doc_attributes = true
format_code_in_doc_comments = true
doc_comment_code_block_width = 100

# Misc
format_macro_matchers = true
hex_literal_case = "Upper"
use_field_init_shorthand = true
use_try_shorthand = true
